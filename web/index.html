<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WEaBuse3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #cfc6b8; font: 13px/1.4 ui-monospace, Menlo, monospace; overflow: hidden; }
  #view { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
  #hud { position: fixed; left: 12px; bottom: 10px; text-shadow: 0 1px 2px #000; pointer-events: none; }
  #help { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; }
  #help div { background: rgba(0, 0, 0, .7); padding: 16px 22px; border: 1px solid #5a4e3c; max-width: 460px; }
  #help b { color: #f0c060; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud">loading…</div>
<div id="help"><div>
  <b>WEaBuse3D · M0 first walk</b><br>
  Click to look around with the mouse.<br>
  W A S D or arrows: walk · Shift: run · Space: jump<br>
  F2: brightness · Esc: release the mouse
</div></div>
<script type="module" src="../client/main.js"></script>
</body>
</html>
